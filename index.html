<style>
/* Layout: a top bar with the courses; home is a grid of tiles (bento); each course is a coloured band with a path of
   lecture stops; quizzes and card review open full screen, one thing at a time (focus mode). One family (Outfit),
   soft grey desk, white tiles, one saturated colour per course. */
:root{
  --desk:#EEF0F4; --desk-2:#E6E9EF; --paper:#FFFFFF; --paper-2:#F5F6F9;
  --ink:#111827; --graphite:#4B5563; --faint:#7C8493; --line:#E2E5EB; --rule:#EDEFF3;
  --pen:#DC2626; --ok:#15803D; --warn:#B45309; --hl:#FDE68A; --hlp:60%;
  --k-compiler:#2F5BD8; --k-os:#7444D6; --k-mm:#C42A6C; --k-qa:#0B7A80; --k-hci:#1E7D40; --k-fp:#C2410C;
  --s-compiler:#2F5BD8; --s-os:#7444D6; --s-mm:#C42A6C; --s-qa:#0B7A80; --s-hci:#1E7D40; --s-fp:#C2410C;
  --c:#4B5563; --s:#111827; --on-s:#FFFFFF; --hero:#111827; --on-hero:#FFFFFF;
  --t-yellow:#FDE68A; --t-green:#CFF5E3; --t-blue:#DBE8FE; --t-pink:#FBE2F0; --t-ink:#111827;
  --aurora:radial-gradient(900px 540px at 0% -10%, rgba(139,92,246,.40), transparent 70%), radial-gradient(820px 520px at 100% 0%, rgba(59,130,246,.30), transparent 70%), radial-gradient(900px 620px at 85% 100%, rgba(236,72,153,.24), transparent 70%), radial-gradient(760px 520px at 5% 100%, rgba(245,158,11,.22), transparent 70%), #F6F4FF;
  --glass:rgba(255,255,255,.6); --hello:linear-gradient(90deg, #6D28D9, #DB2777 55%, #EA580C);
  --g-cont:linear-gradient(135deg, #4F46E5 0%, #7C3AED 52%, #C026D3 100%); --g-due:linear-gradient(140deg, #FDE68A, #FDBA74);
  --g-acc:linear-gradient(140deg, #BBF7D0, #99F6E4); --g-pap:linear-gradient(140deg, #BFDBFE, #C7D2FE); --g-ar:linear-gradient(140deg, #FBCFE8, #F5D0FE);
  --g-weak:linear-gradient(140deg, #FFFFFF, #EDE9FE);
  --tile-bg:#FFFFFF; --tile-ink:#111827; --bk-bg:#D9DAD6; --bk-edge:#E4E2D8;
  --shadow-sm:0 1px 2px rgba(17,24,39,.05);
  --shadow:0 1px 2px rgba(17,24,39,.05), 0 12px 32px -14px rgba(17,24,39,.22);
  --shadow-paper:var(--shadow);
  --radius:18px; --radius-sm:11px;
  --body:"Outfit", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --display:"Newsreader", "Iowan Old Style", Georgia, serif;
  --hand:var(--body);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --desk:#0B0D12; --desk-2:#10131A; --paper:#161A22; --paper-2:#1D222C;
    --ink:#EEF1F6; --graphite:#A8B0BE; --faint:#7A8392; --line:#272C37; --rule:#1F232D;
    --pen:#F87171; --ok:#4ADE80; --warn:#FBBF24; --hl:#A16207; --hlp:45%;
    --k-compiler:#93B0FF; --k-os:#BCA3FF; --k-mm:#FF8FC0; --k-qa:#5FD3D8; --k-hci:#74D79B; --k-fp:#FFA474;
    --c:#C9CFDA; --s:#E5E7EB; --on-s:#111827; --hero:#1E2433; --on-hero:#FFFFFF;
    --t-yellow:#3A3116; --t-green:#10302A; --t-blue:#15284A; --t-pink:#3A1A33; --t-ink:#EEF1F6;
    --aurora:radial-gradient(900px 540px at 0% -10%, rgba(116,68,214,.55), transparent 70%), radial-gradient(820px 520px at 100% 0%, rgba(47,91,216,.42), transparent 70%), radial-gradient(900px 620px at 85% 100%, rgba(196,42,108,.36), transparent 70%), radial-gradient(760px 520px at 5% 100%, rgba(217,119,6,.20), transparent 70%), #0B0D12;
    --glass:rgba(22,26,34,.6); --hello:linear-gradient(90deg, #C4B5FD, #F9A8D4 55%, #FDBA74);
    --g-cont:linear-gradient(135deg, #4338CA 0%, #6D28D9 52%, #A21CAF 100%); --g-due:linear-gradient(140deg, #4A3A0E, #5A2E0D);
    --g-acc:linear-gradient(140deg, #0E3B2C, #0C3A3E); --g-pap:linear-gradient(140deg, #16305C, #26276B); --g-ar:linear-gradient(140deg, #4A1838, #3F1A55);
    --g-weak:linear-gradient(140deg, #1A1E2B, #2A2350);
    --tile-bg:#232937; --tile-ink:#EEF1F6; --bk-bg:#09090B; --bk-edge:#2E3236;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --desk:#0B0D12; --desk-2:#10131A; --paper:#161A22; --paper-2:#1D222C;
  --ink:#EEF1F6; --graphite:#A8B0BE; --faint:#7A8392; --line:#272C37; --rule:#1F232D;
  --pen:#F87171; --ok:#4ADE80; --warn:#FBBF24; --hl:#A16207; --hlp:45%;
  --k-compiler:#93B0FF; --k-os:#BCA3FF; --k-mm:#FF8FC0; --k-qa:#5FD3D8; --k-hci:#74D79B; --k-fp:#FFA474;
  --c:#C9CFDA; --s:#E5E7EB; --on-s:#111827; --hero:#1E2433; --on-hero:#FFFFFF;
  --t-yellow:#3A3116; --t-green:#10302A; --t-blue:#15284A; --t-pink:#3A1A33; --t-ink:#EEF1F6;
  --aurora:radial-gradient(900px 540px at 0% -10%, rgba(116,68,214,.55), transparent 70%), radial-gradient(820px 520px at 100% 0%, rgba(47,91,216,.42), transparent 70%), radial-gradient(900px 620px at 85% 100%, rgba(196,42,108,.36), transparent 70%), radial-gradient(760px 520px at 5% 100%, rgba(217,119,6,.20), transparent 70%), #0B0D12;
  --glass:rgba(22,26,34,.6); --hello:linear-gradient(90deg, #C4B5FD, #F9A8D4 55%, #FDBA74);
  --g-cont:linear-gradient(135deg, #4338CA 0%, #6D28D9 52%, #A21CAF 100%); --g-due:linear-gradient(140deg, #4A3A0E, #5A2E0D);
  --g-acc:linear-gradient(140deg, #0E3B2C, #0C3A3E); --g-pap:linear-gradient(140deg, #16305C, #26276B); --g-ar:linear-gradient(140deg, #4A1838, #3F1A55);
  --g-weak:linear-gradient(140deg, #1A1E2B, #2A2350);
  --tile-bg:#232937; --tile-ink:#EEF1F6; --bk-bg:#09090B; --bk-edge:#2E3236;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -14px rgba(0,0,0,.7);
}
body[data-course="compiler"]{ --c:var(--k-compiler); --s:var(--s-compiler); --on-s:#FFFFFF; }
body[data-course="os"]{ --c:var(--k-os); --s:var(--s-os); --on-s:#FFFFFF; }
body[data-course="mm"]{ --c:var(--k-mm); --s:var(--s-mm); --on-s:#FFFFFF; }
body[data-course="qa"]{ --c:var(--k-qa); --s:var(--s-qa); --on-s:#FFFFFF; }
body[data-course="hci"]{ --c:var(--k-hci); --s:var(--s-hci); --on-s:#FFFFFF; }
body[data-course="fp"]{ --c:var(--k-fp); --s:var(--s-fp); --on-s:#FFFFFF; }
.sp-compiler{ --sp:var(--k-compiler); --spd:var(--s-compiler); } .sp-os{ --sp:var(--k-os); --spd:var(--s-os); } .sp-mm{ --sp:var(--k-mm); --spd:var(--s-mm); } .sp-qa{ --sp:var(--k-qa); --spd:var(--s-qa); } .sp-hci{ --sp:var(--k-hci); --spd:var(--s-hci); } .sp-fp{ --sp:var(--k-fp); --spd:var(--s-fp); }

/* ───── base ───── */
*{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html{ -webkit-text-size-adjust:100%; }
body{ margin:0; background:var(--desk); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased; }
button{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--c); outline-offset:2px; border-radius:6px; }
h1,h2,h3{ font-family:var(--body); font-weight:700; line-height:1.18; letter-spacing:-.02em; margin:0; text-wrap:balance; }
code{ font-family:var(--mono); font-size:.86em; background:var(--paper-2); border:1px solid var(--rule); padding:.05em .35em; border-radius:4px; }
kbd{ font-family:var(--mono); font-size:.75rem; border:1px solid var(--line); border-radius:4px; padding:0 .4em; background:var(--paper); color:var(--graphite); }
.muted{ color:var(--graphite); }
.small{ font-size:.86rem; }
.row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.grow{ flex:1; }
.eyebrow, .kicker{ font-size:.75rem; font-weight:500; letter-spacing:.04em; text-transform:uppercase; color:var(--graphite); margin:0; display:flex; align-items:center; gap:8px; }
.btn{ display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 13px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--paper); color:var(--ink); font-size:.88rem; font-weight:500; cursor:pointer; box-shadow:var(--shadow-sm); transition:background .12s, border-color .12s; white-space:nowrap; }
.btn:hover:not(:disabled){ background:var(--paper-2); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn.solid{ background:var(--s); border-color:var(--s); color:var(--on-s); }
.btn.solid:hover:not(:disabled){ background:var(--s); filter:brightness(1.08); }
.btn.ghost{ background:transparent; border-color:transparent; box-shadow:none; color:var(--graphite); }
.btn.ghost:hover:not(:disabled){ background:var(--paper-2); color:var(--ink); }
.icon-btn{ display:inline-grid; place-items:center; width:34px; height:34px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--paper); color:var(--graphite); cursor:pointer; flex:none; }
.icon-btn:hover{ color:var(--ink); background:var(--paper-2); }
.linkbtn, .link{ border:0; background:none; color:var(--c); cursor:pointer; font-weight:500; font-size:.86rem; padding:2px 0; text-align:left; }
.linkbtn:hover, .link:hover{ text-decoration:underline; }
.boot{ padding:80px 20px; text-align:center; color:var(--graphite); }

/* ───── top bar ───── */
.app{ min-height:100vh; }
.topbar{ position:sticky; top:env(safe-area-inset-top, 0px); z-index:30; display:flex; align-items:center; gap:16px; min-height:64px; padding:10px 28px;
  background:color-mix(in srgb, var(--desk) 86%, transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--line); view-transition-name:topbar; }
.brand{ flex:none; display:flex; align-items:center; gap:10px; border:0; background:none; cursor:pointer; padding:0; color:var(--ink); font:inherit; }
.brand b{ font-size:1.12rem; font-weight:700; letter-spacing:-.01em; }
.logo{ width:34px; height:34px; border-radius:11px; background:var(--s); color:var(--on-s); display:grid; place-items:center; font-weight:800; font-size:1rem; }
.cpills{ flex:1; min-width:0; display:flex; gap:4px; justify-content:center; overflow-x:auto; scrollbar-width:none; }
.cpills::-webkit-scrollbar{ display:none; }
.cpill{ flex:none; display:inline-flex; align-items:center; gap:8px; height:36px; padding:0 14px; border:0; border-radius:99px; background:none; color:var(--graphite); font:inherit; font-size:.92rem; font-weight:500; cursor:pointer; }
.cpill i{ width:8px; height:8px; border-radius:50%; background:var(--sp); }
.cpill:hover{ background:var(--paper); color:var(--ink); }
.cpill[aria-current="true"]{ background:var(--ink); color:var(--desk); }
.tb-tools{ flex:none; display:flex; gap:8px; align-items:center; }
.tb-search{ display:flex; align-items:center; gap:8px; height:36px; padding:0 12px; border:1px solid var(--line); border-radius:12px; background:var(--paper); color:var(--graphite); cursor:pointer; font:inherit; font-size:.9rem; }
.tb-search:hover{ color:var(--ink); }
.readbar{ position:absolute; left:0; right:0; bottom:-1px; height:3px; overflow:hidden; pointer-events:none; }
.readbar i{ display:block; height:100%; background:var(--s); transform:scaleX(0); transform-origin:0 50%; will-change:transform; }
.content{ max-width:1240px; margin:0 auto; padding:28px 36px 72px; }
.foot{ margin-top:36px; color:var(--faint); font-size:.85rem; max-width:80ch; }

/* ───── home: bento tiles ───── */
.home-page{ min-height:100vh; background:var(--aurora); }
.home-page .topbar{ background:var(--glass); border-bottom-color:transparent; }
.home-page .cpill:hover{ background:var(--glass); }
.hello{ display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin:6px 0 22px; }
.hello h1{ font-size:clamp(2.1rem, 4.6vw, 3rem); letter-spacing:-.03em; background:var(--hello); -webkit-background-clip:text; background-clip:text; color:transparent; padding-bottom:.06em; }
.hello p{ margin:4px 0 0; color:var(--graphite); }
.hsearch{ display:flex; align-items:center; gap:10px; width:min(380px, 100%); height:48px; padding:0 16px; border:0; border-radius:14px; background:var(--glass); color:var(--graphite); font:inherit; font-size:.95rem; cursor:pointer; box-shadow:0 0 0 1px rgba(124,58,237,.22), var(--shadow-sm); }
.hsearch span{ flex:1; text-align:left; }
.bento{ display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:14px; }
.tile{ position:relative; overflow:hidden; border:0; border-radius:22px; padding:20px 22px; background:var(--tile-bg); color:var(--tile-ink); text-align:left; font:inherit; display:flex; flex-direction:column; gap:4px; min-height:176px; }
button.tile{ cursor:pointer; transition:transform .15s ease, box-shadow .15s ease; }
button.tile:hover:not(:disabled){ transform:translateY(-3px); box-shadow:0 18px 36px -16px color-mix(in srgb, var(--spd, #7C3AED) 70%, transparent); }
.tile{ animation:tile-in .5s cubic-bezier(.2,.8,.2,1) both; }
.bento > :nth-child(2){ animation-delay:.05s; } .bento > :nth-child(3){ animation-delay:.1s; } .bento > :nth-child(5){ animation-delay:.2s; } .bento > :nth-child(6){ animation-delay:.25s; } .bento > :nth-child(7){ animation-delay:.3s; }
.t-courses > :nth-child(1){ animation-delay:.12s; } .t-courses > :nth-child(2){ animation-delay:.15s; } .t-courses > :nth-child(3){ animation-delay:.18s; } .t-courses > :nth-child(4){ animation-delay:.21s; } .t-courses > :nth-child(5){ animation-delay:.24s; } .t-courses > :nth-child(6){ animation-delay:.27s; }
@keyframes tile-in{ from{ opacity:0; transform:translateY(14px) scale(.985); } }
@media (prefers-reduced-motion: reduce){ .tile{ animation:none; } }
button.tile:disabled{ cursor:default; }
.tl{ font-size:.88rem; font-weight:500; opacity:.78; }
.big{ font-size:2.8rem; font-weight:700; letter-spacing:-.03em; line-height:1.05; font-variant-numeric:tabular-nums; }
.tsub{ font-size:.9rem; opacity:.82; margin-top:auto; }
.t-cont{ --spd:#7C3AED; grid-column:span 2; background:var(--g-cont); color:#fff; box-shadow:0 20px 44px -22px rgba(109,40,217,.75); flex-direction:row; align-items:center; gap:26px; min-height:216px; }
.ring{ --p:0; position:relative; width:124px; height:124px; flex:none; display:grid; place-items:center; }
.ring::before{ content:""; position:absolute; inset:0; border-radius:50%; background:conic-gradient(#fff calc(var(--p) * 1%), rgba(255,255,255,.22) 0);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 14px), #000 calc(100% - 13px)); mask:radial-gradient(farthest-side, transparent calc(100% - 14px), #000 calc(100% - 13px)); }
.ring i{ font-style:normal; font-size:1.5rem; font-weight:700; }
.tc-text{ display:flex; flex-direction:column; gap:4px; min-width:0; }
.tc-title{ font-size:clamp(1.3rem, 2.4vw, 1.7rem); font-weight:700; line-height:1.15; letter-spacing:-.015em; }
.tc-sub{ opacity:.72; font-size:.92rem; }
.tgo{ align-self:flex-start; margin-top:12px; background:#fff; color:#5B21B6; border-radius:12px; padding:9px 16px; font-weight:600; }
.t-due{ --spd:#F59E0B; background:var(--g-due); color:var(--t-ink); }
.t-due .tsub{ max-width:58%; }
.stk{ position:absolute; right:22px; bottom:22px; width:88px; height:60px; }
.stk i{ position:absolute; inset:0; background:#fff; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.14); }
.stk i:nth-child(1){ transform:rotate(-11deg); } .stk i:nth-child(2){ transform:rotate(-4deg); } .stk i:nth-child(3){ transform:rotate(4deg); }
.t-acc{ background:var(--g-acc); color:var(--t-ink); }
.bars{ display:flex; gap:6px; height:76px; margin-top:10px; }
.bars > span{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; }
.bars b{ flex:1; width:100%; display:flex; align-items:flex-end; }
.bars i{ display:block; width:100%; background:#10B981; border-radius:6px; }
.bars em{ font-style:normal; font-size:.75rem; opacity:.7; }
.t-courses{ grid-column:1 / -1; display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); gap:14px; }
.t-course{ background:linear-gradient(155deg, var(--spd) 35%, color-mix(in srgb, var(--spd) 72%, #000)); color:#fff; min-height:156px; }
.t-course::after{ content:""; position:absolute; right:-34px; bottom:-34px; width:116px; height:116px; border-radius:50%; background:rgba(255,255,255,.08); pointer-events:none; }
.tcn{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-start; gap:4px 8px; }
.tcn b{ font-size:1.25rem; font-weight:700; }
.tcn em{ font-style:normal; font-size:.78rem; font-weight:600; background:rgba(0,0,0,.22); border-radius:99px; padding:2px 9px; white-space:nowrap; }
.tcs{ font-size:.84rem; opacity:.92; }
.dots{ display:flex; gap:4px; margin-top:auto; margin-bottom:4px; }
.dots i{ flex:1; max-width:18px; height:6px; border-radius:9px; background:rgba(255,255,255,.35); }
.dots i.f{ background:#fff; }
.t-weak{ grid-column:span 2; min-height:0; background:var(--g-weak); color:var(--ink); }
.t-weak ul{ list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:8px; }
.t-weak li button{ width:100%; display:flex; align-items:center; gap:10px; border:0; border-radius:12px; background:var(--glass); padding:11px 14px; font:inherit; color:var(--ink); cursor:pointer; text-align:left; }
.t-weak li button:hover{ background:var(--paper); }
.t-weak li i{ width:8px; height:8px; border-radius:50%; background:var(--sp); flex:none; }
.t-weak li span{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.t-weak li em{ font-style:normal; color:var(--pen); font-weight:600; font-size:.88rem; flex:none; }
.tempty{ color:var(--graphite); margin:10px 0 0; max-width:46ch; }
.t-papers{ --spd:#3B82F6; background:var(--g-pap); color:var(--t-ink); }
.t-ar{ --spd:#EC4899; background:var(--g-ar); color:var(--t-ink); }
.t-papers::after, .t-ar::after{ content:""; position:absolute; right:-40px; bottom:-40px; width:150px; height:150px; border-radius:50%; background:var(--glass); opacity:.55; pointer-events:none; }
.t-ar .big{ font-family:"IBM Plex Sans Arabic", "Noto Sans Arabic", Tahoma, sans-serif; font-size:2.3rem; }
.t-ar.on{ box-shadow:inset 0 0 0 3px var(--t-ink); }
/* on a desktop the home is one screen: the tiles share the window's height, so there is nothing to scroll unless the window is too short for them */
@media (min-width:1001px){
  .home-page{ display:flex; flex-direction:column; min-height:100vh; min-height:100dvh; }
  .content.home{ flex:1 0 auto; width:100%; display:flex; flex-direction:column; padding-top:20px; padding-bottom:18px; }
  .home .hello{ margin:0 0 18px; }
  .home .bento{ flex:1 0 auto; max-height:840px; grid-template-rows:auto auto auto; align-content:stretch; }
  .home .tile{ min-height:0; }
  .home .foot{ margin-top:14px; flex:none; }
}
/* short laptop windows: tighter tiles so the whole dashboard still fits */
@media (min-width:1001px) and (max-height:940px){
  .content.home{ padding-top:12px; padding-bottom:12px; }
  .home .hello{ margin-bottom:12px; } .home .hello h1{ font-size:2.05rem; } .home .hsearch{ height:42px; }
  .home .bento{ gap:12px; } .home .t-courses{ gap:12px; }
  .home .tile{ padding:14px 18px; border-radius:20px; }
  .home .big{ font-size:2.2rem; }

/* ───── course: coloured band, section pills, the path ───── */

/* ───── surfaces ───── */

.sizes{ display:inline-flex; border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; background:var(--paper); }

.hlswatch{ width:12px; height:8px; border-radius:2px; background:var(--hl); }
.tbtn[aria-pressed="false"] .hlswatch{ background:var(--line); }
.resume{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; font-size:.86rem; color:var(--graphite); margin:0 0 12px; padding:8px 12px; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-sm); }
.read .paper{ padding:36px clamp(20px, 4vw, 52px); }
.page-head{ padding-bottom:18px; border-bottom:1px solid var(--line); margin-bottom:4px; }
.page-head h2{ font-size:1.6rem; margin:6px 0 6px; letter-spacing:-.02em; }
.page-head .meta{ font-size:.82rem; color:var(--graphite); margin:0; }
.note{ padding-block:22px 6px; scroll-margin-top:70px; }
.note h3{ font-size:1.12rem; margin-bottom:10px; display:flex; gap:10px; align-items:baseline; }

.note ul{ margin:0; padding-left:1.15em; display:flex; flex-direction:column; gap:.55em; max-width:72ch; font-size:var(--rfs); line-height:1.7; color:color-mix(in srgb, var(--ink) 88%, var(--graphite)); }

.tbl{ overflow-x:auto; margin:6px 0 14px; border:1px solid var(--line); border-radius:var(--radius-sm); }

.formula{ font-family:var(--mono); font-size:calc(var(--rfs) * .82); line-height:1.8; white-space:pre; overflow-x:auto; padding:12px 16px; margin:6px 0 14px; background:var(--paper-2); border:1px solid var(--rule); border-radius:var(--radius-sm); }

@media (max-width:1180px){ .read{ grid-template-columns:minmax(0, 1fr); } .outline{ display:none; } .secpick{ display:block; } }

/* ───── cards ───── */

.icard.flipped .in{ transform:rotateY(180deg); }
.face{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; background:var(--paper); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); text-align:left; display:flex; flex-direction:column; overflow:hidden; }
.face .fhead{ padding:14px 20px 12px; border-bottom:1px solid var(--rule); display:flex; justify-content:space-between; gap:10px; font-size:.78rem; color:var(--graphite); }
.face .fhead .l{ color:var(--graphite); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.face .fbody{ flex:1; padding:18px 24px 22px; overflow:auto; line-height:1.6; }
.face.front .fbody{ display:flex; align-items:center; justify-content:center; text-align:center; }
.face.front .term{ font-size:clamp(1.25rem, 3vw, 1.7rem); font-weight:600; letter-spacing:-.015em; line-height:1.3; }
.face.back{ transform:rotateY(180deg); }
.face.back .ans{ font-size:clamp(.98rem, 2vw, 1.08rem); }
.face .ftip{ position:absolute; right:16px; bottom:10px; font-size:.75rem; color:var(--faint); }
.known-stamp{ position:absolute; right:14px; top:-10px; z-index:2; font-size:.75rem; font-weight:600; color:var(--ok); background:var(--paper); border:1px solid color-mix(in srgb, var(--ok) 40%, var(--line)); border-radius:99px; padding:1px 9px; }
@media (max-width:560px){ .icard{ aspect-ratio:4/5; } }
.cardctl{ display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; }
.count{ font-family:var(--mono); font-variant-numeric:tabular-nums; min-width:76px; text-align:center; color:var(--graphite); font-size:.85rem; }
.btn.knew[aria-pressed="true"]{ border-color:var(--ok); color:var(--ok); }
.thin{ width:min(680px, 100%); height:4px; background:var(--paper-2); border-radius:99px; overflow:hidden; }
.thin i{ display:block; height:100%; background:var(--c); border-radius:99px; transition:width .3s; }
.rates{ display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px; width:min(680px, 100%); }
.rate{ border:1px solid var(--line); background:var(--paper); border-radius:var(--radius-sm); padding:9px 8px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:1px; min-height:54px; box-shadow:var(--shadow-sm); }
.rate b{ font-size:.92rem; font-weight:600; }
.rate small{ font-size:.75rem; color:var(--graphite); }
.rate.again b{ color:var(--pen); } .rate.good b{ color:var(--ok); }
.rate:hover{ background:var(--paper-2); }

/* ───── Q&A ───── */
.askgroup{ padding-block:4px 16px; }
.askgroup h3{ font-size:1rem; margin:12px 0 8px; display:flex; gap:10px; align-items:baseline; }
.askgroup h3 .sec{ font-family:var(--mono); font-size:.75rem; color:var(--faint); font-weight:400; }
.askitem{ border-bottom:1px solid var(--rule); padding-block:12px; }
.askitem:last-child{ border-bottom:0; }
.askq{ display:grid; grid-template-columns:32px minmax(0, 1fr) auto; gap:8px; align-items:start; }
.askq .qn{ font-family:var(--mono); font-size:.75rem; color:var(--faint); padding-top:3px; }
.askq p{ margin:0; font-weight:500; }
.askans{ margin:10px 0 0 40px; padding:10px 14px; background:var(--paper-2); border-radius:var(--radius-sm); white-space:pre-wrap; max-width:75ch; }

/* ───── quiz ───── */
.setup, .mockcard{ display:grid; grid-template-columns:minmax(0, 1.4fr) minmax(0, 1fr); gap:28px; }
.mockcard{ margin-top:16px; }
.setup h2, .mockcard h2{ font-size:1.25rem; margin:6px 0 8px; }
.fieldset{ display:flex; flex-direction:column; gap:8px; margin-top:20px; }
.flabel{ font-size:.75rem; font-weight:500; color:var(--graphite); text-transform:uppercase; letter-spacing:.04em; }
.cover{ background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; align-self:start; }
.cover .big{ font-size:2.4rem; font-weight:600; letter-spacing:-.03em; line-height:1.1; font-variant-numeric:tabular-nums; }
.cover .unit{ font-size:1rem; color:var(--graphite); font-weight:500; }
.cover ul{ margin:10px 0 16px; padding-left:1.1em; color:var(--graphite); font-size:.86rem; display:flex; flex-direction:column; gap:6px; }
.nomatch{ margin-top:12px; padding:10px 12px; background:color-mix(in srgb, var(--warn) 9%, var(--paper)); border:1px solid color-mix(in srgb, var(--warn) 30%, var(--line)); border-radius:var(--radius-sm); display:flex; flex-direction:column; gap:8px; }
.nomatch p{ margin:0; }
.nomatch .btn{ height:30px; font-size:.8rem; }
@media (max-width:820px){ .setup, .mockcard{ grid-template-columns:1fr; } }
.omr{ display:flex; gap:3px; margin-bottom:18px; }
.omr i{ flex:1; height:4px; border-radius:99px; background:var(--paper-2); }
.omr i.cur{ background:var(--faint); }
.omr i.ok{ background:var(--ok); }
.omr i.no{ background:var(--pen); }
.qtop{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:.8rem; color:var(--graphite); margin-bottom:10px; }
.tag{ display:inline-flex; align-items:center; height:22px; padding:0 9px; border-radius:99px; background:var(--paper-2); color:var(--graphite); font-size:.75rem; font-weight:500; }
.tag.lec{ background:color-mix(in srgb, var(--c) 12%, transparent); color:var(--c); }
.tag.exam{ background:color-mix(in srgb, var(--pen) 12%, transparent); color:var(--pen); }
.qtext{ font-size:clamp(1.15rem, 2.4vw, 1.35rem); font-weight:600; line-height:1.4; letter-spacing:-.01em; margin:4px 0 20px; max-width:62ch; }
.opts{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
.opt{ display:grid; grid-template-columns:30px minmax(0, 1fr) 24px; gap:12px; align-items:center; width:100%; text-align:left; border:1px solid var(--line); background:var(--paper); cursor:pointer; padding:11px 14px; border-radius:var(--radius-sm); transition:border-color .12s, background .12s; }
.opt:hover:not(:disabled){ border-color:color-mix(in srgb, var(--ink) 30%, var(--line)); }
.opt:disabled{ cursor:default; }
.bubble{ width:26px; height:26px; border-radius:6px; border:1px solid var(--line); display:grid; place-items:center; font-family:var(--mono); font-size:.78rem; color:var(--graphite); background:var(--paper-2); }
.opt.picked{ border-color:var(--ink); }
.opt.picked .bubble{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
.opt.answer{ border-color:var(--ok); background:color-mix(in srgb, var(--ok) 7%, var(--paper)); }
.opt.answer .bubble{ background:var(--ok); border-color:var(--ok); color:#fff; }
.opt.picked:not(.answer){ border-color:var(--pen); background:color-mix(in srgb, var(--pen) 6%, var(--paper)); }
.opt.picked:not(.answer) .bubble{ background:var(--pen); border-color:var(--pen); color:#fff; }
.opt .otext{ font-size:.95rem; }
.opt.answer .otext{ font-weight:500; }
.mark{ width:20px; height:20px; }
.mark path{ fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
.opt.answer .mark path{ stroke:var(--ok); }
.mark[aria-label="your wrong answer"] path{ stroke:var(--pen); }
.why{ margin:6px 0 4px 42px; font-size:.88rem; color:var(--graphite); max-width:72ch; }
.why b{ font-size:.75rem; font-weight:600; margin-right:6px; text-transform:uppercase; letter-spacing:.04em; }
.why.right b{ color:var(--ok); } .why.wrong b{ color:var(--pen); }
.why.right{ color:var(--ink); }
.qfoot{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-top:22px; padding-top:16px; border-top:1px solid var(--line); }
.qfoot .pen{ font-size:.95rem; }
.score{ display:grid; place-items:center; min-width:110px; height:110px; border-radius:50%; background:var(--paper-2); border:1px solid var(--line); }
.score .pen{ font-size:1.8rem; font-weight:600; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
.review{ margin-top:24px; display:flex; flex-direction:column; }
.review h3{ font-size:1rem; margin-bottom:6px; }
.rv{ padding-block:12px; border-bottom:1px solid var(--rule); }
.rv:last-child{ border-bottom:0; }
.rv .q{ font-weight:500; }
.rv p{ margin:6px 0 0; font-size:.9rem; }
.rv .bad, .rv .good{ font-size:.75rem; font-weight:600; margin-right:6px; text-transform:uppercase; letter-spacing:.04em; }
.rv .bad{ color:var(--pen); } .rv .good{ color:var(--ok); }

/* ───── mock exam ───── */
.mockbar{ position:sticky; top:calc(env(safe-area-inset-top, 0px) + 60px); z-index:20; display:flex; gap:14px; align-items:center; flex-wrap:wrap; padding:10px 14px; margin-bottom:14px; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
.clock{ font-family:var(--mono); font-size:1.3rem; font-variant-numeric:tabular-nums; font-weight:500; }
.clock.low{ color:var(--pen); }
.mockgrid{ display:grid; grid-template-columns:minmax(0, 1fr) 220px; gap:20px; align-items:start; }
.navgrid{ position:sticky; top:130px; display:flex; flex-direction:column; gap:10px; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:14px; }
.nums{ display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; }
.nums button{ aspect-ratio:1; border-radius:6px; border:1px solid var(--line); background:var(--paper); cursor:pointer; font-family:var(--mono); font-size:.75rem; color:var(--graphite); padding:0; min-width:30px; }
.nums button.done{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
.nums button.flag{ box-shadow:0 0 0 2px var(--paper), 0 0 0 3.5px var(--warn); }
.nums button[aria-current="step"]{ outline:2px solid var(--c); outline-offset:1px; }
.btn.flagged{ border-color:var(--warn); color:var(--warn); }
@media (max-width:900px){ .mockgrid{ grid-template-columns:1fr; } .navgrid{ position:static; } .nums{ grid-template-columns:repeat(auto-fill, minmax(34px, 1fr)); } }
.mockrv summary{ cursor:pointer; list-style:none; display:block; }
.mockrv summary::-webkit-details-marker{ display:none; }
.mockrv .opts{ margin-top:10px; }
.mockrv .opt{ cursor:default; }

/* ───── past papers ───── */
.papers{ display:grid; grid-template-columns:220px minmax(0, 1fr); gap:20px; align-items:start; }
.plist{ display:flex; flex-direction:column; gap:4px; position:sticky; top:72px; }
.pitem{ text-align:left; border:1px solid transparent; background:none; border-radius:var(--radius-sm); padding:8px 10px; cursor:pointer; font-size:.86rem; line-height:1.3; color:var(--graphite); }
.pitem small{ display:block; font-size:.75rem; color:var(--faint); margin-top:2px; }
.pitem:hover{ background:var(--paper-2); color:var(--ink); }
.pitem[aria-current="true"]{ background:var(--paper); border-color:var(--line); color:var(--ink); font-weight:500; box-shadow:var(--shadow-sm); }
@media (max-width:900px){ .papers{ grid-template-columns:1fr; } .plist{ position:static; flex-direction:row; overflow-x:auto; scrollbar-width:none; } .pitem{ flex:none; } }
.exhead{ padding-bottom:14px; border-bottom:1px solid var(--line); }
.exhead h2{ font-size:1.4rem; margin:6px 0 4px; }
.exhead p{ margin:0; color:var(--graphite); font-size:.88rem; }
.exnote{ margin:14px 0 0; padding:10px 12px; background:color-mix(in srgb, var(--warn) 8%, var(--paper)); border:1px solid color-mix(in srgb, var(--warn) 25%, var(--line)); border-radius:var(--radius-sm); font-size:.88rem; }
.exnote .pen{ color:var(--warn); margin-right:4px; }
.extools{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:14px 0 2px; }
.extools .pen{ font-size:1rem; }
.psec{ margin-top:24px; }
.psec-h{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding-bottom:6px; border-bottom:1px solid var(--line); }
.psec-h h3{ font-size:1rem; }
.psec-h span{ font-size:.8rem; color:var(--graphite); white-space:nowrap; }
.eq{ display:grid; grid-template-columns:28px minmax(0, 1fr); gap:6px; padding-block:14px; border-bottom:1px solid var(--rule); content-visibility:auto; contain-intrinsic-size:auto 140px; }
.eq:last-child{ border-bottom:0; }
.eq .num{ color:var(--faint); padding-top:2px; }
.eq .qt{ font-weight:500; overflow-x:auto; }
.eq .qt table{ border-collapse:collapse; margin:8px 0; font-weight:400; font-size:.88rem; }
.eq .qt td, .eq .qt th{ border:1px solid var(--line); padding:4px 10px; text-align:left; }
.eopts{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.eopt{ display:flex; gap:8px; align-items:center; border:1px solid var(--line); background:var(--paper); border-radius:var(--radius-sm); cursor:pointer; padding:5px 10px 5px 6px; text-align:left; font-size:.9rem; }
.eopt:disabled{ cursor:default; }
.eopt .bubble{ width:22px; height:22px; font-size:.75rem; flex:none; }
.eopt.picked{ border-color:var(--pen); }
.eopt.picked .bubble{ background:var(--pen); border-color:var(--pen); color:#fff; }
.eopt.answer{ border-color:var(--ok); background:color-mix(in srgb, var(--ok) 7%, var(--paper)); font-weight:500; }
.eopt.answer .bubble{ background:var(--ok); border-color:var(--ok); color:#fff; }
.draft{ width:100%; min-height:84px; margin-top:10px; border:1px solid var(--line); background:var(--paper-2); border-radius:var(--radius-sm); padding:10px 12px; font:inherit; font-size:.92rem; color:var(--ink); resize:vertical; }
.model{ margin-top:12px; padding:12px 14px; background:var(--paper-2); border:1px solid var(--rule); border-radius:var(--radius-sm); }
.model .lab{ font-size:.75rem; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--graphite); margin-bottom:6px; }
.model .keyn{ display:inline-block; font-size:.75rem; color:var(--warn); background:color-mix(in srgb, var(--warn) 12%, transparent); border-radius:99px; padding:1px 8px; margin-bottom:8px; }
.model .ansbox{ overflow-x:auto; margin-bottom:8px; }
.model .ansbox table{ border-collapse:collapse; font-size:.86rem; background:var(--paper); }
.model .ansbox th, .model .ansbox td{ border:1px solid var(--line); padding:5px 10px; text-align:left; vertical-align:top; }
.model .ansbox pre{ font-family:var(--mono); font-size:.8rem; background:var(--paper); border:1px solid var(--rule); border-radius:6px; padding:10px 12px; overflow-x:auto; margin:6px 0; }
.model .expl{ color:var(--graphite); font-size:.9rem; }
.model .expl b{ color:var(--ink); font-weight:600; }

/* ───── progress ───── */
.progress{ display:flex; flex-direction:column; gap:16px; }
.pg-stats{ display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); gap:10px; }
.pg-stats > div{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; display:flex; flex-direction:column; gap:4px; box-shadow:var(--shadow-sm); }
.pg-stats b{ font-size:1.4rem; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1.1; }
.pg-stats b .of{ font-size:.9rem; color:var(--faint); font-weight:500; }
.pg-stats span{ font-size:.78rem; color:var(--graphite); }
@media (max-width:1100px){ .pg-stats{ grid-template-columns:repeat(3, minmax(0, 1fr)); } }
@media (max-width:520px){ .pg-stats{ grid-template-columns:repeat(2, minmax(0, 1fr)); } }
.pg-next ol{ list-style:none; margin:12px 0 0; padding:0; display:flex; flex-direction:column; gap:10px; }
.pg-next li{ display:grid; grid-template-columns:30px minmax(0, 1fr); gap:10px; padding:14px; border:1px solid var(--line); border-radius:var(--radius-sm); }
.pg-n{ width:24px; height:24px; border-radius:50%; background:var(--paper-2); display:grid; place-items:center; font-size:.78rem; font-weight:600; color:var(--graphite); }
.pg-next h3{ font-size:.98rem; margin-bottom:2px; }
.pg-next p{ margin:0 0 10px; color:var(--graphite); font-size:.88rem; max-width:65ch; }
.ledger{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); overflow-x:auto; box-shadow:var(--shadow-sm); }
.ledger table{ width:100%; border-collapse:collapse; font-size:.86rem; }
.ledger th{ text-align:left; font-size:.75rem; font-weight:500; color:var(--graphite); padding:10px 14px; border-bottom:1px solid var(--line); background:var(--paper-2); white-space:nowrap; }
.ledger td{ padding:10px 14px; border-bottom:1px solid var(--rule); vertical-align:middle; }
.ledger tr:last-child td{ border-bottom:0; }
.ledger tbody tr{ cursor:pointer; }
.ledger tbody tr:hover td{ background:var(--paper-2); }
.pg-table .cname{ align-items:baseline; }
.pg-table .lnum{ font-family:var(--mono); font-size:.75rem; color:var(--faint); }
.pg-table .lt{ font-weight:500; min-width:160px; }
.ledger small, .dtable small{ font-size:.75rem; }
.status{ display:inline-flex; align-items:center; height:22px; font-size:.75rem; font-weight:500; border-radius:99px; padding:0 9px; white-space:nowrap; background:var(--paper-2); color:var(--graphite); }
.status.weak{ color:var(--pen); background:color-mix(in srgb, var(--pen) 12%, transparent); }
.status.strong{ color:var(--ok); background:color-mix(in srgb, var(--ok) 12%, transparent); }
.status.new{ color:var(--faint); }
.misshead{ display:flex; justify-content:space-between; gap:16px; align-items:flex-end; flex-wrap:wrap; padding-bottom:14px; border-bottom:1px solid var(--line); }
.misshead h2{ font-size:1.2rem; }
.fixed-n{ color:var(--ok); font-weight:500; font-size:.85em; }

/* ───── revision sheet ───── */
.revsheet .rev-lec{ padding-block:20px 8px; border-bottom:1px solid var(--rule); scroll-margin-top:70px; }
.revsheet .rev-lec:last-child{ border-bottom:0; }
.revsheet h3{ font-size:1.05rem; margin-bottom:10px; display:flex; gap:10px; align-items:baseline; }
.revsheet h3 .sec{ font-family:var(--mono); font-size:.75rem; color:var(--faint); font-weight:400; }
.terms{ margin:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap:4px 28px; }
.term{ padding-block:7px; border-bottom:1px solid var(--rule); font-size:.9rem; line-height:1.5; }
.term dt{ font-weight:600; }
.term dd{ margin:2px 0 0; color:var(--graphite); }
.covered{ filter:blur(5px); cursor:pointer; user-select:none; transition:filter .2s; border-radius:3px; }
.covered:hover, .covered:focus-visible{ filter:blur(3px); }
.rev-exam{ margin-top:12px; }
.rev-exam ul{ margin:6px 0 0; padding-left:1.1em; display:flex; flex-direction:column; gap:8px; font-size:.9rem; }
.rev-exam .arrow{ color:var(--faint); }
.rev-exam b{ color:var(--ok); }

/* ───── search ───── */
.scrim{ position:fixed; inset:0; z-index:60; background:rgba(9,9,11,.4); backdrop-filter:blur(2px); display:flex; justify-content:center; align-items:flex-start; padding:calc(env(safe-area-inset-top, 0px) + 10vh) 16px 16px; }
.palette{ width:min(680px, 100%); background:var(--paper); border:1px solid var(--line); border-radius:14px; box-shadow:0 24px 64px -16px rgba(0,0,0,.45); display:flex; flex-direction:column; max-height:76vh; overflow:hidden; }
.palette .sin{ display:flex; gap:10px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); color:var(--graphite); }
.palette input{ flex:1; border:0; outline:0; background:transparent; font:inherit; font-size:1rem; color:var(--ink); min-width:0; }
.results{ overflow:auto; padding:6px; }
.res{ display:grid; grid-template-columns:10px minmax(0, 1fr); gap:12px; width:100%; text-align:left; border:0; background:none; cursor:pointer; padding:9px 12px; border-radius:8px; }
.res:hover, .res.on{ background:var(--paper-2); }
.chipdot{ width:8px; height:8px; border-radius:50%; background:var(--sp, var(--c)); margin-top:7px; }
.res .rt{ font-weight:500; }
.res .rm{ font-size:.75rem; color:var(--faint); }
.res .rs{ font-size:.84rem; color:var(--graphite); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.res mark{ background:color-mix(in srgb, var(--hl) 70%, transparent); color:inherit; border-radius:2px; }
.shint{ padding:8px 16px; border-top:1px solid var(--line); font-size:.78rem; color:var(--graphite); display:flex; gap:14px; flex-wrap:wrap; }

/* ───── buttons in the sidebar footer ───── */
.lamp{ display:inline-flex; align-items:center; gap:7px; height:32px; padding:0 10px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--paper); cursor:pointer; color:var(--graphite); font-size:.84rem; font-weight:500; flex:1; justify-content:center; }
.lamp:hover{ color:var(--ink); }
.lamp svg{ overflow:visible; }
.lamp .shade{ fill:currentColor; stroke:currentColor; stroke-width:1.2; stroke-linejoin:round; }
.lamp .stem{ fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; }
.lamp .rays{ fill:none; stroke:var(--warn); stroke-width:1.8; stroke-linecap:round; }
.lamp.off .rays{ opacity:0; }
.lamp.off .shade{ fill:transparent; }
.langbtn{ height:32px; padding:0 12px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--paper); cursor:pointer; color:var(--graphite); font-family:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif; font-weight:600; font-size:.9rem; flex:1; }
.langbtn:hover{ color:var(--ink); }
.langbtn.on{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

/* ───── focus mode hides the frame ───── */
body.focus-read .band{ display:none; }

/* ───── tablet and phone ───── */
@media (max-width:960px){
